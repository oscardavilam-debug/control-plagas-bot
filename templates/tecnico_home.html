<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FumilabControl | App Técnico en Campo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fumilab">
    <link rel="manifest" href="/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('PWA Service Worker listo', reg.scope))
            .catch(err => console.log('PWA SW error:', err));
        });
      }
    </script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- Header Móvil -->
    <div class="flex justify-between items-center py-2 border-b border-slate-800">
        <a href="/" class="text-xs font-bold text-emerald-400 flex items-center space-x-1">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Portal Web</span>
        </a>
        <a href="/dashboard" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold">
            Panel Central
        </a>
    </div>

    <!-- Identidad Central -->
    <div class="text-center my-6 space-y-3">
        <div class="w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 rounded-3xl flex items-center justify-center text-4xl font-black mx-auto shadow-xl shadow-emerald-500/20">
            <i class="fa-solid fa-shield-virus"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight">FUMILAB<span class="text-emerald-400">CONTROL</span></h1>
        <p class="text-xs text-slate-400">App Operativa de Campo • Jonathan Dávila (Técnico)</p>
    </div>

    <!-- Menú Táctil 2x2 Corregido -->
    <div class="grid grid-cols-2 gap-4 my-auto">
        <!-- Reporte / Firma -->
        <a href="/reporte_campo" class="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-6 rounded-3xl flex flex-col items-center text-center space-y-3 shadow-lg active:scale-95 transition">
            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center text-xl">
                <i class="fa-solid fa-file-signature"></i>
            </div>
            <span class="text-xs font-black">Reporte / Firma</span>
        </a>

        <!-- Escanear QR -->
        <a href="/escaner_qr" class="bg-slate-900 border border-slate-800 hover:border-cyan-500/50 p-6 rounded-3xl flex flex-col items-center text-center space-y-3 shadow-lg active:scale-95 transition">
            <div class="w-12 h-12 bg-cyan-500/10 text-cyan-400 rounded-2xl flex items-center justify-center text-xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <span class="text-xs font-black">Escanear QR</span>
        </a>

        <!-- Agenda / Citas -->
        <a href="/prospectos" class="bg-slate-900 border border-slate-800 hover:border-amber-500/50 p-6 rounded-3xl flex flex-col items-center text-center space-y-3 shadow-lg active:scale-95 transition">
            <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center text-xl">
                <i class="fa-solid fa-calendar-check"></i>
            </div>
            <span class="text-xs font-black">Agenda / Citas</span>
        </a>

        <!-- Cámara Evidencia Directa -->
        <label class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-6 rounded-3xl flex flex-col items-center text-center space-y-3 shadow-lg active:scale-95 transition cursor-pointer">
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="alert('Foto capturada correctamente. Abre el Reporte de Campo para adjuntarla al certificado.')">
            <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-xl">
                <i class="fa-solid fa-camera"></i>
            </div>
            <span class="text-xs font-black">Cámara Evidencia</span>
        </label>
    </div>

    <!-- Botón Inferior de Ayuda -->
    <div class="pt-6">
        <a href="https://wa.me/525586406475" target="_blank" class="w-full py-3 bg-slate-900 border border-slate-800 rounded-2xl text-xs font-bold text-slate-300 flex items-center justify-center space-x-2">
            <i class="fa-brands fa-whatsapp text-emerald-400"></i>
            <span>Soporte Técnico Operativo</span>
        </a>
    </div>

</body>
</html>
