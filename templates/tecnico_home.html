<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FumilabControl | App Técnico</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between p-4">

    <!-- Top Bar -->
    <div class="flex justify-between items-center py-2 px-1">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Modo Técnico En Campo</span>
        </div>
        <a href="/admin" class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">
            Panel Web
        </a>
    </div>

    <!-- Branding Central -->
    <div class="text-center my-4">
        <div class="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-tr from-emerald-600 to-teal-500 p-1 shadow-xl shadow-emerald-600/20 flex items-center justify-center">
            <div class="w-full h-full bg-white rounded-[22px] flex items-center justify-center">
                <i class="fa-solid fa-shield-virus text-4xl text-emerald-600"></i>
            </div>
        </div>
        <h1 class="text-2xl font-black text-slate-900 mt-4 tracking-tight">FUMILABCONTROL</h1>
        <p class="text-xs text-slate-500 font-medium">Desinfección & Manejo Integral de Plagas</p>
    </div>

    <!-- Cuadrícula 2x2 de Módulos Operativos (Idéntico a Plagap) -->
    <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto w-full my-auto">
        <!-- 1. Reporte de Servicio -->
        <a href="/reporte_campo" class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-md hover:shadow-xl transition flex flex-col items-center justify-center text-center space-y-3 active:scale-95 group">
            <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl group-hover:bg-emerald-600 group-hover:text-white transition shadow-sm">
                <i class="fa-solid fa-file-pen"></i>
            </div>
            <span class="font-extrabold text-xs text-slate-800 tracking-tight">Reporte / Firma</span>
        </a>

        <!-- 2. Escáner QR de Cebaderos -->
        <a href="/escaner_qr" class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-md hover:shadow-xl transition flex flex-col items-center justify-center text-center space-y-3 active:scale-95 group">
            <div class="w-16 h-16 rounded-2xl bg-cyan-50 text-cyan-600 flex items-center justify-center text-2xl group-hover:bg-cyan-600 group-hover:text-white transition shadow-sm">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <span class="font-extrabold text-xs text-slate-800 tracking-tight">Escanear QR</span>
        </a>

        <!-- 3. Agenda de Citas / Check-in -->
        <a href="/admin" class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-md hover:shadow-xl transition flex flex-col items-center justify-center text-center space-y-3 active:scale-95 group">
            <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-2xl group-hover:bg-amber-600 group-hover:text-white transition shadow-sm">
                <i class="fa-solid fa-calendar-check"></i>
            </div>
            <span class="font-extrabold text-xs text-slate-800 tracking-tight">Agenda / Citas</span>
        </a>

        <!-- 4. Fotos y Evidencia -->
        <a href="/reporte_campo" class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-md hover:shadow-xl transition flex flex-col items-center justify-center text-center space-y-3 active:scale-95 group">
            <div class="w-16 h-16 rounded-2xl bg-violet-50 text-violet-600 flex items-center justify-center text-2xl group-hover:bg-violet-600 group-hover:text-white transition shadow-sm">
                <i class="fa-solid fa-camera"></i>
            </div>
            <span class="font-extrabold text-xs text-slate-800 tracking-tight">Cámara Evidencia</span>
        </a>
    </div>

    <!-- Soporte y Registro PWA -->
    <div class="max-w-sm mx-auto w-full pt-4 text-center">
        <a href="https://wa.me/525586406475" target="_blank" class="inline-flex items-center space-x-2 text-xs font-bold text-emerald-600 bg-white px-4 py-2 rounded-full border border-emerald-200 shadow-sm">
            <i class="fa-brands fa-whatsapp text-sm"></i>
            <span>Soporte Técnico Operativo</span>
        </a>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
