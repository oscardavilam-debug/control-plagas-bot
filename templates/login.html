<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | FUMILAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-green-700 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-2xl font-black text-gray-900 tracking-tight">FUMILAB ADMIN</h2>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Panel de Control y Gestión</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña de Administrador</label>
                <input type="password" name="password" required placeholder="••••••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-600 focus:bg-white focus:outline-none text-sm transition">
            </div>

            <button type="submit" class="w-full py-3.5 bg-green-700 hover:bg-green-800 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                <span>Ingresar al Sistema</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-gray-400 hover:text-gray-600 transition">
                <i class="fas fa-arrow-left mr-1"></i> Volver a la página principal
            </a>
        </div>
    </div>
</body>
</html>
