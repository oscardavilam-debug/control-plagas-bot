<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización Registrada | FumilabControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800/80 border border-slate-700 rounded-3xl p-8 text-center space-y-5 backdrop-blur-xl shadow-2xl">
        <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-3xl mx-auto border border-emerald-500/30">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1 class="text-2xl font-black">¡Solicitud Registrada!</h1>
        <p class="text-xs text-slate-300 leading-relaxed">
            Tu cotización ha sido guardada en nuestro sistema central con el folio oficial:
        </p>
        <div class="p-3 bg-slate-900 rounded-2xl font-mono text-emerald-400 font-bold text-lg border border-slate-700">
            {{ folio }}
        </div>
        <p class="text-[11px] text-slate-400">
            Un especialista técnico se pondrá en contacto contigo de inmediato a tu número registrado.
        </p>
        <div class="pt-2 space-y-2">
            <a href="/prospectos" class="block w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                Ir a Bandeja de Prospectos
            </a>
            <a href="/" class="block w-full py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-xs transition">
                Volver al Inicio
            </a>
        </div>
    </div>
</body>
</html>
