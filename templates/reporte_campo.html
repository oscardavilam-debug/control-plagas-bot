<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Servicio | FumilabControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fumilab">
    <link rel="manifest" href="/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('PWA Service Worker listo', reg.scope))
            .catch(err => console.log('PWA SW error:', err));
        });
      }
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">

    <!-- HEADER CON RETORNO REAL -->
    <header class="bg-emerald-600 text-slate-950 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <a href="/tecnico" class="w-9 h-9 bg-slate-950 text-white rounded-xl flex items-center justify-center text-sm shadow">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="font-black text-sm text-slate-950 leading-tight">REPORTE DE SERVICIO</h1>
                <span class="text-[10px] font-bold text-emerald-950 uppercase tracking-wider block">FumilabControl Oficial</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <a href="/dashboard" class="px-2.5 py-1.5 bg-slate-950 text-white rounded-lg text-[10px] font-bold">
                Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-3xl p-5 space-y-4 shadow-xl text-xs font-semibold">
            
            <!-- Cliente -->
            <div>
                <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Cliente / Establecimiento *</label>
                <select id="cliente_id" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none">
                    {% for c in clientes %}
                    <option value="{{ c.id }}">{{ c.nombre_comercial }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Horarios y Check-in -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Hora Inicio</label>
                    <input type="text" id="hora_inicio" value="08:30 AM" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-center">
                    <button type="button" onclick="document.getElementById('hora_inicio').value = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})" class="w-full mt-1.5 py-1.5 bg-emerald-500/20 text-emerald-400 rounded-lg text-[10px] font-bold">▶ Check In Ahora</button>
                </div>
                <div>
                    <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Hora Fin</label>
                    <input type="text" id="hora_fin" value="09:45 AM" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-center">
                    <button type="button" onclick="document.getElementById('hora_fin').value = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})" class="w-full mt-1.5 bg-rose-500/20 text-rose-400 rounded-lg text-[10px] font-bold">■ Check Out Ahora</button>
                </div>
            </div>

            <!-- Tipo de Visita -->
            <div>
                <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Tipo de Servicio MIP *</label>
                <select id="tipo_visita" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none">
                    <option>MANEJO INTEGRAL DE CUCARACHAS (MIP)</option>
                    <option>CONTROL INTEGRAL DE ROEDORES (CEBADEROS)</option>
                    <option>DESINFECCION AMBIENTAL Y SANITIZACION</option>
                    <option>FUMIGACION GENERAL PERIMETRAL</option>
                </select>
            </div>

            <!-- Químico y Dosis -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Producto Químico</label>
                    <select id="producto" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none">
                        <option>DEMAND DUO</option>
                        <option>RODILON BLOQUE</option>
                        <option>BIOCIDAL PLUS</option>
                        <option>TERMICIDA PREMISE</option>
                    </select>
                </div>
                <div>
                    <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Dosis Aplicada</label>
                    <input type="text" id="dosis" value="4 ml / L de agua" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">
                </div>
            </div>

            <!-- Actividades -->
            <div>
                <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Actividades Realizadas</label>
                <textarea id="actividades" rows="2" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">Aspersión perimetral focalizada y colocación de gel cucarachicida en zoclos y contactos.</textarea>
            </div>

            <!-- Firma Digital -->
            <div>
                <label class="block uppercase text-slate-400 text-[10px] font-black mb-1">Firma Digital de Conformidad del Cliente</label>
                <div class="border border-slate-700 bg-white rounded-2xl overflow-hidden">
                    <canvas id="firma-pad" width="400" height="150" class="w-full touch-none"></canvas>
                </div>
                <button type="button" onclick="signaturePad.clear()" class="text-[10px] text-rose-400 font-bold mt-1">Limpiar Firma</button>
            </div>

            <button type="button" onclick="guardarServicio()" id="btn-guardar" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl text-sm shadow-xl shadow-emerald-500/20 transition">
                Finalizar Servicio & Emitir Certificado
            </button>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('firma-pad');
        const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)' });

        function guardarServicio() {
            const btn = document.getElementById('btn-guardar');
            btn.disabled = true;
            btn.textContent = 'Guardando y Generando PDF...';

            const payload = {
                cliente_id: document.getElementById('cliente_id').value,
                hora_inicio: document.getElementById('hora_inicio').value,
                hora_fin: document.getElementById('hora_fin').value,
                tipo_visita: document.getElementById('tipo_visita').value,
                producto: document.getElementById('producto').value,
                dosis: document.getElementById('dosis').value,
                actividades: document.getElementById('actividades').value,
                firma: signaturePad.isEmpty() ? '' : signaturePad.toDataURL(),
                fotos: []
            };

            fetch('/api/guardar_reporte_servicio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    window.location.href = '/servicio_exitoso/' + data.folio;
                } else {
                    alert('Error: ' + data.message);
                    btn.disabled = false;
                    btn.textContent = 'Finalizar Servicio & Emitir Certificado';
                }
            })
            .catch(err => {
                alert('Fallo de conexión');
                btn.disabled = false;
                btn.textContent = 'Finalizar Servicio & Emitir Certificado';
            });
        }
    </script>
</body>
</html>
